<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starting zd</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: Canvas;
        color: CanvasText;
      }

      main {
        max-width: 32rem;
        padding: 2rem;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.25rem;
      }

      p {
        margin: 0;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="zd-startup-title">
      <h1 id="zd-startup-title">Starting zd</h1>
      <p id="zd-startup-status" role="status" aria-live="polite">
        Starting the local workbench host…
      </p>
    </main>
  </body>
</html>
