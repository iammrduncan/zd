[package]
name = "zd"
version = "0.1.0"
description = "ZenSuite — a fast, local agent workbench for projects, threads, terminals, files, and Git."
authors = ["Duncan"]
edition = "2021"
license = "MIT"
repository = "https://github.com/iammrduncan/zd"

[lib]
# The `_lib` suffix keeps the lib name from colliding with the bin name on
# Windows. See https://github.com/rust-lang/cargo/issues/8519
name = "zd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
notify-debouncer-mini = "0.7.0"
portable-pty = "0.9.0"
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
trash = "5.2.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "NSArray",
  "NSError",
  "NSBundle",
  "NSObject",
  "NSSet",
  "NSString",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSSound"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = [
  "std",
  "block2",
  "UNNotification",
  "UNNotificationAction",
  "UNNotificationCategory",
  "UNNotificationContent",
  "UNNotificationRequest",
  "UNNotificationResponse",
  "UNNotificationSettings",
  "UNNotificationTrigger",
  "UNUserNotificationCenter",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
