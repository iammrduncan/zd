[package]
name = "zd-host"
version = "0.2.10"
description = "Host authority for the zd workbench"
edition = "2021"
license = "MIT"
repository = "https://github.com/iammrduncan/zd"

[dependencies]
getrandom = "0.4"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
trash = "5.2.6"
