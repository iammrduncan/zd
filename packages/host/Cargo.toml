[package]
name = "zd-host"
version = "0.2.10"
description = "Host authority for the zd workbench"
edition = "2021"
license = "MIT"
repository = "https://github.com/iammrduncan/zd"

[dependencies]
getrandom = "0.4"
ignore = "0.4"
notify-debouncer-mini = "0.7.0"
portable-pty = "0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
trash = "5.2.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
