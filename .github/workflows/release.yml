name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev
      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Match tag to package version
        run: npm run release:check -- "$GITHUB_REF_NAME"
      - name: Run static and unit checks
        run: npm run check
      - name: Install the browser used by end-to-end checks
        run: npx playwright install --with-deps chromium
      - name: Run browser end-to-end checks
        run: npm run test:e2e
      - name: Run served-host end-to-end checks
        run: npm run test:e2e:served
      - name: Test the Rust workspace
        run: cargo test --workspace
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Lint the Rust workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

  build-macos:
    name: Build macOS (${{ matrix.artifact }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            artifact: zd-macos-arm64
          - runner: macos-15-intel
            artifact: zd-macos-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Install the browser used by installed-app checks
        run: npx playwright install chromium
      - name: Build the app and disk image
        run: npm run package:macos
      - name: Smoke the installed application
        shell: bash
        run: |
          shopt -s nullglob
          dmgs=(target/release/bundle/dmg/zd_*.dmg)
          if (( ${#dmgs[@]} != 1 )); then
            echo "zd: expected one macOS disk image" >&2
            exit 1
          fi
          npm run smoke:macos -- "${dmgs[0]}"
      - name: Verify and checksum the disk image
        shell: bash
        run: |
          cd target/release/bundle/dmg
          for dmg in zd_*.dmg; do
            hdiutil verify "$dmg"
            shasum -a 256 "$dmg" > "$dmg.sha256"
          done
      - name: Hold the release download
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/release/bundle/dmg/zd_*.dmg
            target/release/bundle/dmg/zd_*.dmg.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build-linux:
    name: Build Linux (x86_64 Debian)
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install native build and smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            dbus-x11 \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            xvfb
      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Install the browser used by installed-app checks
        run: npx playwright install --with-deps chromium
      - name: Build the Debian package
        run: npm run package:linux
      - name: Smoke and checksum the installed package
        shell: bash
        run: |
          shopt -s nullglob
          debs=(target/release/bundle/deb/zd_*.deb)
          if (( ${#debs[@]} != 1 )); then
            echo "zd: expected one Linux Debian package" >&2
            exit 1
          fi
          npm run smoke:linux -- "${debs[0]}"
          deb="$(basename "${debs[0]}")"
          cd target/release/bundle/deb
          sha256sum "$deb" > "$deb.sha256"
      - name: Hold the release download
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zd-linux-x86_64
          path: |
            target/release/bundle/deb/zd_*.deb
            target/release/bundle/deb/zd_*.deb.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [build-macos, build-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out the tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Collect platform downloads
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: zd-*
          path: dist
          merge-multiple: true
      - name: Verify the exact download set and checksums
        run: node packages/scripts/release/verify-downloads.mjs dist
      - name: Publish the tagged release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.dmg \
            dist/*.deb \
            dist/*.sha256 \
            --verify-tag \
            --generate-notes \
            --title "zd $GITHUB_REF_NAME"
