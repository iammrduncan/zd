name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify ${{ github.ref_name }}
    runs-on: macos-15
    steps:
      - name: Check out the tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Match tag to package version
        run: npm run release:check -- "$GITHUB_REF_NAME"
      - name: Run static and unit checks
        run: npm run check
      - name: Install the browser used by end-to-end checks
        run: npx playwright install chromium
      - name: Run end-to-end checks
        run: npm run test:e2e
      - name: Test the native shell
        run: cargo test --manifest-path packages/tauri/Cargo.toml
      - name: Lint the native shell
        run: cargo clippy --manifest-path packages/tauri/Cargo.toml --all-targets -- -D warnings

  build-macos:
    name: Build macOS (${{ matrix.artifact }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            artifact: zd-macos-arm64
          - runner: macos-15-intel
            artifact: zd-macos-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build the app and disk image
        run: npm run package:macos
      - name: Verify and checksum the disk image
        shell: bash
        run: |
          cd packages/tauri/target/release/bundle/dmg
          for dmg in zd_*.dmg; do
            echo "Verifying $dmg"
            hdiutil verify "$dmg"
            shasum -a 256 "$dmg" > "$dmg.sha256"
          done
      - name: Hold the release download
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            packages/tauri/target/release/bundle/dmg/zd_*.dmg
            packages/tauri/target/release/bundle/dmg/zd_*.dmg.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build-windows:
    name: Build Windows (x86_64)
    needs: verify
    runs-on: windows-2025
    steps:
      - name: Check out the tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build the app and NSIS installer
        run: npm run tauri -- build --config packages/tauri/tauri.conf.json --bundles nsis --ci
      - name: Checksum the installer
        shell: pwsh
        run: |
          $directory = "packages/tauri/target/release/bundle/nsis"
          $installers = Get-ChildItem -Path $directory -Filter "zd_*.exe"
          if ($installers.Count -eq 0) {
            throw "No Windows installer was produced"
          }
          foreach ($installer in $installers) {
            $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($installer.Name)" | Set-Content -NoNewline "$($installer.FullName).sha256"
          }
      - name: Hold the release download
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zd-windows-x86_64
          path: |
            packages/tauri/target/release/bundle/nsis/zd_*.exe
            packages/tauri/target/release/bundle/nsis/zd_*.exe.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect platform downloads
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: zd-*
          path: dist
          merge-multiple: true
      - name: Verify collected checksums
        run: cd dist && shasum -a 256 -c *.sha256
      - name: Publish the tagged release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.dmg \
            dist/*.exe \
            dist/*.sha256 \
            --verify-tag \
            --generate-notes \
            --title "zd $GITHUB_REF_NAME"
