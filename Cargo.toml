[package]
name = "zd"
version = "1.0.1"
edition = "2024"
license = "MIT"
description = "A native terminal workbench for reading, editing, and reviewing project files"
repository = "https://github.com/mbox01/zd"

[dependencies]
arboard = "3.6.1"
blake3 = "1.8.2"
crossterm = "0.28.1"
ignore = "0.4.32"
pulldown-cmark = "0.13.0"
png = "0.18.0"
ratatui = "0.29.0"
regex = "1.13.1"
ropey = "1.6.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.19"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.0"

[dev-dependencies]
portable-pty = "0.9.0"
tempfile = "3.27.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "zd"
path = "src/main.rs"

[profile.release]
lto = "thin"
strip = true
